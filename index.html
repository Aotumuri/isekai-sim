<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>異世界シミュレーター</title>
  </head>
  <body>
    <div id="app">
      <main class="map-start">
        <h1>異世界シミュレーター</h1>
        <p>生成する地図の規模を選んでください。</p>
        <form method="get">
          <button name="map" value="japan-scale">
            <strong>日本規模</strong>
            <span>日本ほどの広さに、多様な海岸線と地形が広がります。</span>
          </button>
          <button name="map" value="world-map">
            <strong>世界規模</strong>
            <span>大陸と大洋、長い山脈を含む世界です。</span>
          </button>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
