[git]
commit = "allow"
push = "deny"
pull_request = "deny"

[tracker]
backend = "github"

[tracker.github]
repository = "Aotumuri/isekai-sim"
create_issue = "ask"
create_label = "ask"
delete_label = "ask"
update_issue = "ask"
comment = "ask"
close_issue = "ask"
close_on = "published"

[execution]
codex_cli_path = "/opt/homebrew/bin/codex"
auto_resume = false
max_active_workers = 1
