[git]
commit = "allow"
push = "deny"
pull_request = "deny"

[tracker]
backend = "github"

[tracker.github]
repository = "Aotumuri/isekai-sim"
create_issue = "allow"
create_label = "allow"
delete_label = "allow"
update_issue = "allow"
comment = "allow"
close_issue = "allow"
close_on = "local"

[execution]
codex_cli_path = "/opt/homebrew/bin/codex"
auto_resume = true
max_active_workers = 1
